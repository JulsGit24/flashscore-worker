name: WNBA slate

on:
  schedule:
    # Target: the first opportunity at or after 16:00 America/New_York.
    # Scheduled runs are routinely delayed, so try every hour through the
    # evening; the gate stops once today's slate exists.
    - cron: '7 20-23 * * *'
  workflow_dispatch:
    inputs:
      day_offset:
        description: '0 = today, 1 = tomorrow'
        default: '0'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          today=$(TZ=America/New_York date +%F)

          if [ "${{ github.event_name }}" != 'schedule' ]; then
            echo 'go=true' >> "$GITHUB_OUTPUT"
          elif [ "$hour" -lt 16 ]; then
            echo 'go=false' >> "$GITHUB_OUTPUT"
            echo "New York hour is $hour — too early. A later cron will pick it up."
          elif [ -f "reports/wnba/$today.md" ]; then
            echo 'go=false' >> "$GITHUB_OUTPUT"
            echo "$today already has a slate; nothing to do."
          else
            echo 'go=true' >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

      - name: Generate the WNBA slate
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'America/New_York' }}
        run: |
          node src/wnba.js \
            --day-offset "${{ github.event.inputs.day_offset || 0 }}" \
            --quiet

      - name: Publish the slate to the job summary
        if: always()
        run: |
          latest=$(ls -1 reports/wnba/*.md 2>/dev/null | sort | tail -1)
          if [ -n "$latest" ]; then
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No slate was produced — check the Generate step.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the slate
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/wnba/ data/
          if git diff --cached --quiet; then
            echo 'No new slate to commit.'
          else
            git commit -m "WNBA slate for $(TZ=America/New_York date +%F)"
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((attempt * 5))
            done
            echo 'Could not push after three attempts.' >&2
            exit 1
          fi
