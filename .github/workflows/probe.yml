name: Probe the feed and the runner

# Manual only. Reconnaissance for work that has to be done against the live
# feed, which no Claude agent environment can reach.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: What can this runner render a PDF with?
        run: |
          echo '=== BROWSERS ==='
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            path=$(command -v "$bin" || true)
            if [ -n "$path" ]; then
              echo "FOUND $bin -> $path -> $("$bin" --version 2>&1 | head -1)"
            else
              echo "ABSENT $bin"
            fi
          done
          echo '=== EMOJI FONTS ==='
          fc-list 2>/dev/null | grep -i -E 'emoji' | head -5 || echo 'NO EMOJI FONT'
          echo '=== PDF SMOKE TEST ==='
          printf '<h1>hello</h1><p style="font-size:40px">flag test: \xf0\x9f\x87\xac\xf0\x9f\x87\xa7 \xf0\x9f\x87\xaf\xf0\x9f\x87\xb5</p>' > /tmp/t.html
          if command -v google-chrome >/dev/null; then
            google-chrome --headless --no-sandbox --disable-gpu \
              --print-to-pdf=/tmp/t.pdf --no-pdf-header-footer file:///tmp/t.html 2>&1 | tail -3
            echo "pdf: $(file -b /tmp/t.pdf 2>/dev/null) $(stat -c%s /tmp/t.pdf 2>/dev/null) bytes"
          fi

      - name: Image hosts, with real filenames
        run: node tools/probe-images.js

      - name: Image URL patterns
        run: |
          # Which of the documented Flashscore image hosts actually answer, and
          # what do they answer with? A 200 that returns HTML is not an image.
          for url in \
            "https://www.flashscore.com/res/image/data/tVCPMLzL-hUJhKmVe.png" \
            "https://static.flashscore.com/res/image/data/tVCPMLzL-hUJhKmVe.png" \
            "https://www.flashscoreusa.com/res/image/data/tVCPMLzL-hUJhKmVe.png"
          do
            code=$(curl -s -o /tmp/img -w '%{http_code}' -m 15 "$url" || echo 000)
            echo "$code  $(file -b /tmp/img 2>/dev/null | head -c 60)  $url"
          done
