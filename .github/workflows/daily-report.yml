name: Daily soccer shortlist

on:
  schedule:
    # GitHub cron is always UTC. This fires at 05:03 UTC — change the hour to
    # hit 5am in your own timezone, e.g. 03:03 UTC for 5am CEST (UTC+2),
    # 10:03 UTC for 5am US Central (UTC-5).
    - cron: '3 5 * * *'
  workflow_dispatch:
    inputs:
      day_offset:
        description: '0 = today, 1 = tomorrow'
        default: '0'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

      - name: Generate shortlist
        env:
          # IANA timezone used for the kickoff times printed in the report.
          REPORT_TZ: ${{ vars.REPORT_TZ || 'UTC' }}
        run: |
          node src/index.js \
            --day-offset "${{ github.event.inputs.day_offset || 0 }}" \
            --min 30 \
            --quiet

      - name: Commit the report
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/
          if git diff --cached --quiet; then
            echo 'No new report to commit.'
          else
            git commit -m "Shortlist for $(date -u +%F)"
            git push
          fi

      - name: Publish the report to the job summary
        if: always()
        run: |
          latest=$(ls -1 reports/*.md | grep -v EXAMPLE | sort | tail -1)
          cat "$latest" >> "$GITHUB_STEP_SUMMARY"
