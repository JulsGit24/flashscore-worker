name: Daily soccer shortlist

on:
  schedule:
    # Target: 05:00 America/New_York, year round. GitHub cron is UTC only and
    # does not follow DST, so both candidate hours fire and the `gate` job
    # checks the real New York hour — 09:0x UTC is 5am EDT, 10:0x is 5am EST,
    # and whichever one is not 5am stops before doing any work.
    - cron: '3 9 * * *'
    - cron: '3 10 * * *'
  workflow_dispatch:
    inputs:
      day_offset:
        description: '0 = today, 1 = tomorrow'
        default: '0'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" != 'schedule' ] || [ "$hour" = '05' ]; then
            echo 'go=true' >> "$GITHUB_OUTPUT"
          else
            echo 'go=false' >> "$GITHUB_OUTPUT"
            echo "New York hour is $hour, not 05 — this is the other DST slot."
          fi

  report:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

      # TEMPORARY: verifying the WNBA quarter capture end to end.
      - name: Verify the WNBA slate
        continue-on-error: true
        env:
          REPORT_TZ: America/New_York
        run: node src/wnba.js --format md 2>&1 | sed -n '/Quarters and halves/,/Best quarter/p' | head -30

      - name: Generate shortlists
        env:
          # IANA timezone the kickoff times are printed in.
          REPORT_TZ: ${{ vars.REPORT_TZ || 'America/New_York' }}
        run: |
          # One pass per region. The day feed is worldwide and the results cache
          # is shared, so the second and third runs cost almost nothing.
          for region in europe americas asia; do
            echo "::group::$region"
            node src/index.js \
              --region "$region" \
              --day-offset "${{ github.event.inputs.day_offset || 0 }}" \
              --min 30 \
              --quiet
            echo "::endgroup::"
          done

      - name: Publish the reports to the job summary
        if: always()
        run: |
          found=0
          for region in europe americas asia; do
            latest=$(ls -1 "reports/$region"/*.md 2>/dev/null | sort | tail -1)
            if [ -n "$latest" ]; then
              found=1
              cat "$latest" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$found" = 0 ]; then
            echo 'No reports were produced — check the Generate step.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the report
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/ data/
          if git diff --cached --quiet; then
            echo 'No new report to commit.'
          else
            git commit -m "Shortlists for $(TZ=America/New_York date +%F)"
            git push
          fi
