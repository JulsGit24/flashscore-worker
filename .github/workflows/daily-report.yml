name: Daily soccer shortlist

on:
  schedule:
    # Target: 05:00 America/New_York, year round. GitHub cron is UTC only and
    # does not follow DST, so both candidate hours fire and the `gate` job
    # checks the real New York hour — 09:0x UTC is 5am EDT, 10:0x is 5am EST,
    # and whichever one is not 5am stops before doing any work.
    - cron: '3 9 * * *'
    - cron: '3 10 * * *'
  workflow_dispatch:
    inputs:
      day_offset:
        description: '0 = today, 1 = tomorrow'
        default: '0'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" != 'schedule' ] || [ "$hour" = '05' ]; then
            echo 'go=true' >> "$GITHUB_OUTPUT"
          else
            echo 'go=false' >> "$GITHUB_OUTPUT"
            echo "New York hour is $hour, not 05 — this is the other DST slot."
          fi

  report:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

      # TEMPORARY: diagnosing the standings endpoint. Remove once fixed.
      - name: Probe standings feed
        continue-on-error: true
        run: |
          node scripts/probe-standings.js 2>&1 | tee /tmp/probe.txt
          {
            echo '<details><summary>standings probe</summary>'
            echo
            echo '```'
            head -c 60000 /tmp/probe.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate shortlist
        env:
          # IANA timezone the kickoff times are printed in.
          REPORT_TZ: ${{ vars.REPORT_TZ || 'America/New_York' }}
        run: |
          node src/index.js \
            --day-offset "${{ github.event.inputs.day_offset || 0 }}" \
            --min 30 \
            --quiet

      - name: Publish the report to the job summary
        if: always()
        run: |
          latest=$(ls -1 reports/*.md 2>/dev/null | grep -v EXAMPLE | sort | tail -1)
          if [ -n "$latest" ]; then
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report was produced — check the Generate step.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the report
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/
          if git diff --cached --quiet; then
            echo 'No new report to commit.'
          else
            git commit -m "Shortlist for $(TZ=America/New_York date +%F)"
            git push
          fi
