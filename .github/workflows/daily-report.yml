name: Daily soccer shortlist

on:
  schedule:
    # Target: the first opportunity at or after 05:00 America/New_York.
    #
    # GitHub cron is UTC and does not follow DST, and — more importantly —
    # scheduled runs are routinely delayed under load, by an hour or more. An
    # earlier version fired at 09:03/10:03 UTC and required the New York hour to
    # be exactly 05; every run arrived late and was skipped, so the schedule
    # never once produced a report.
    #
    # So: try every hour through the morning, and let the gate decide. The gate
    # is idempotent — it stops once today's report exists — so the extra crons
    # cost a few seconds each and the report survives a late or failed run.
    #
    # The window opens at 03:00 New York rather than 05:00. The reader — a
    # scheduled agent — wakes at 05:15 and expects the report to be waiting for
    # it, so generation needs a couple of hours of slack ahead of that, not
    # zero. The day's fixtures are published long before 3am either way.
    - cron: '7 6-13 * * *'
  workflow_dispatch:
    inputs:
      day_offset:
        description: '0 = today, 1 = tomorrow'
        default: '0'
      force:
        description: 'regenerate even if today already has a report'
        default: 'false'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          hour=$(TZ=America/New_York date +%H)
          today=$(TZ=America/New_York date +%F)

          if [ "${{ github.event_name }}" != 'schedule' ]; then
            if [ "${{ github.event.inputs.force }}" = 'true' ] || [ ! -f "reports/europe/$today.md" ]; then
              echo 'go=true' >> "$GITHUB_OUTPUT"
            else
              echo 'go=false' >> "$GITHUB_OUTPUT"
              echo "Dispatched, but $today already has a report. Re-run with force=true to replace it."
            fi
          elif [ "$hour" -lt 3 ]; then
            echo 'go=false' >> "$GITHUB_OUTPUT"
            echo "New York hour is $hour — too early. A later cron will pick it up."
          elif [ -f "reports/europe/$today.md" ]; then
            echo 'go=false' >> "$GITHUB_OUTPUT"
            echo "$today already has a report; nothing to do."
          else
            echo 'go=true' >> "$GITHUB_OUTPUT"
            echo "New York hour is $hour and $today has no report yet — generating."
          fi

  report:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

      - name: Generate shortlists
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'America/New_York' }}
        run: |
          # One pass per region. The day feed is worldwide and the results cache
          # is shared, so the second and third runs cost almost nothing.
          for region in europe americas asia; do
            echo "::group::$region"
            node src/index.js \
              --region "$region" \
              --day-offset "${{ github.event.inputs.day_offset || 0 }}" \
              --min 30 \
              --quiet
            echo "::endgroup::"
          done

      - name: Publish the reports to the job summary
        if: always()
        run: |
          found=0
          for region in europe americas asia; do
            latest=$(ls -1 "reports/$region"/*.md 2>/dev/null | sort | tail -1)
            if [ -n "$latest" ]; then
              found=1
              cat "$latest" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$found" = 0 ]; then
            echo 'No reports were produced — check the Generate step.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the reports
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/ data/
          if git diff --cached --quiet; then
            echo 'No new report to commit.'
          else
            git commit -m "Shortlists for $(TZ=America/New_York date +%F)"
            # The morning crons overlap with other runs; rebase rather than fail.
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((attempt * 5))
            done
            echo 'Could not push after three attempts.' >&2
            exit 1
          fi
